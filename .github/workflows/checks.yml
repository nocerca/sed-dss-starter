name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: node --test tests/frontend.test.mjs tests/openclaw-config.test.mjs tests/postman-scripts.test.mjs
      - run: docker compose config --quiet
      - run: python scripts/check_release.py
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[browser]'
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser/check_frontend.py
