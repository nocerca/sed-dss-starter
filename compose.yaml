services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sed_dss
      POSTGRES_USER: sed
      POSTGRES_PASSWORD: sed_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sed -d sed_dss"]
      interval: 3s
      timeout: 3s
      retries: 15
    # БД недоступна с хоста: только внутренняя сеть Compose
  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://sed:sed_dev_password@db:5432/sed_dss}
      APP_API_KEY: ${APP_API_KEY:-local-dev-only-change-before-exposure}
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      ALLOW_EXTERNAL_LLM: ${ALLOW_EXTERNAL_LLM:-false}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-0}
      MAX_DOCUMENT_BYTES: ${MAX_DOCUMENT_BYTES:-5242880}
      IDEMPOTENCY_SECRET: ${IDEMPOTENCY_SECRET:-}
      OPENCLAW_BASE_URL: http://openclaw:18789/v1
      OPENCLAW_API_KEY: ${OPENCLAW_GATEWAY_TOKEN:-}
      OPENCLAW_MODEL: openclaw/sed-dss
      LANGUAGE_TOOL_ENABLED: ${LANGUAGE_TOOL_ENABLED:-false}
      LANGUAGE_TOOL_BASE_URL: http://languagetool:8081/v2
      LANGUAGE_TOOL_TIMEOUT_SECONDS: ${LANGUAGE_TOOL_TIMEOUT_SECONDS:-20}
    networks: [default, language]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
  openclaw:
    image: ghcr.io/openclaw/openclaw:2026.9.3
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint: ["node", "/opt/sed-dss/openclaw-entrypoint.mjs"]
    environment:
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_READONLY: "1"
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      OPENCLAW_DISABLE_BONJOUR: "1"
      MODEL_BACKEND: ${MODEL_BACKEND:-yandex}
      YANDEX_API_KEY: ${YANDEX_API_KEY:-}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
      YANDEX_MODEL: ${YANDEX_MODEL:-aliceai-llm-flash}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      ZAI_MODEL: ${ZAI_MODEL:-glm-4.7-flash}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat-2}
      MODEL_BRIDGE_API_KEY: ${MODEL_BRIDGE_API_KEY:-}
    volumes:
      - ./deploy/openclaw-entrypoint.mjs:/opt/sed-dss/openclaw-entrypoint.mjs:ro
      - ./deploy/openclaw-config.mjs:/opt/sed-dss/openclaw-config.mjs:ro
    tmpfs:
      - /home/node/.openclaw:uid=1000,gid=1000,mode=0700,size=128m
      - /home/node/.cache:uid=1000,gid=1000,mode=0700,size=128m
      - /tmp:mode=1777,size=256m
    # No published port, Docker socket, corpus mount or persistent agent state.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18789/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s
  languagetool:
    profiles: [language]
    build:
      context: .
      dockerfile: deploy/languagetool.Dockerfile
    image: sed-dss-languagetool:6.6
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=0700,size=64m
    networks: [language]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
  model-bridge:
    profiles: [gigachat]
    build: .
    command: ["uvicorn", "app.model_bridge:app", "--host", "0.0.0.0", "--port", "8001", "--no-access-log"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      MODEL_BRIDGE_API_KEY: ${MODEL_BRIDGE_API_KEY:-}
      GIGACHAT_AUTH_KEY: ${GIGACHAT_AUTH_KEY:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat-2}
    tmpfs:
      - /tmp:size=32m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/live', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 3
volumes:
  postgres_data:
networks:
  language:
    internal: true
